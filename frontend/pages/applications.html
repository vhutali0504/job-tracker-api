<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Tracker | Applications</title>
  <link rel="stylesheet" href="../styles/dashboard.css" />
  <link rel="stylesheet" href="../styles/applications.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-logo">JobTracker</div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="applications.html" class="active">Applications</a>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main">
    <div class="header">
      <div>
        <h1>Applications</h1>
        <p>Track and manage all your job applications</p>
      </div>
      <button class="btn-add" onclick="openModal()">+ Add Application</button>
    </div>

    <!-- Applications Table -->
    <div class="recent">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Company</th>
              <th>Role</th>
              <th>Status</th>
              <th>Date Applied</th>
              <th>Notes</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="applicationsList">
            <tr>
              <td colspan="6" class="empty">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Add Application</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-group">
      <label>Company</label>
      <input type="text" id="company" placeholder="e.g. Google" />
    </div>
    <div class="form-group">
      <label>Role</label>
      <input type="text" id="role" placeholder="e.g. Junior Software Engineer" />
    </div>
    <div class="form-group">
      <label>Status</label>
      <select id="status">
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
      </select>
    </div>
    <div class="form-group">
      <label>Date Applied</label>
      <input type="date" id="dateApplied" />
    </div>
    <div class="form-group">
      <label>Notes</label>
      <textarea id="notes" placeholder="Any notes about this application..."></textarea>
    </div>

    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveApplication()">Save</button>
    </div>
  </div>

  <script src="applications.js"></script>
</body>
</html>
