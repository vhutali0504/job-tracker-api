<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Job Tracker | Login</title>
  <link rel="stylesheet" href="styles/auth.css" />
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>JobTracker</h1>
      <p>Manage your job applications</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="john@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="login()">Login</button>
    </div>

    <!-- Register Form -->
    <div id="registerForm" style="display: none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="registerName" placeholder="John Doe" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="registerEmail" placeholder="john@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="registerPassword" placeholder="••••••••" />
      </div>
      <button class="btn" onclick="register()">Create Account</button>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script src="index.js"></script>
</body>
</html>
